<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>Stock N Sales</title>
    <meta name="theme-color" content="#071a2c">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Stock N Sales">

    <link rel="manifest" href="/manifest.json">
    <link rel="icon" href="/icons/app-icon-192.png" type="image/png">
    <link rel="apple-touch-icon" href="/icons/app-icon-192.png">

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <!-- ==========================================
         TOP NAVIGATION
    =========================================== -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-mark">
                <img
                    src="Logo.png"
                    alt="Stock N Sales logo"
                    class="brand-logo"
                >
            </div>

            <div class="brand-info">
                <strong>Stock N Sales</strong>
                <span>Inventory Management</span>
            </div>

        </div>


        <nav class="main-navigation">

            <a
                href="#"
                class="nav-item active"
                data-page="Dashboard"
            >
                Dashboard
            </a>

            <a
                href="#"
                class="nav-item"
                data-page="Inventory"
            >
                Inventory
            </a>

            <a
                href="#"
                class="nav-item"
                data-page="Sales"
            >
                Sales
            </a>

            <a
                href="#"
                class="nav-item"
                data-page="AI Prediction"
            >
                Demand Prediction
            </a>

            <a
                href="#"
                class="nav-item"
                data-page="Analytics"
            >
                Reports
            </a>

        </nav>


        <div class="system-status">

            <span class="status-dot"></span>

            <button
                id="installAppButton"
                class="logout-button"
                type="button"
                hidden
            >
                Install app
            </button>

            <button
                id="syncNowButton"
                class="logout-button"
                type="button"
                hidden
            >
                Sync now
            </button>

            <button
                id="cloudAccountButton"
                class="logout-button"
                type="button"
            >
                Connect cloud
            </button>

            <button
                id="switchWorkspaceButton"
                class="logout-button"
                type="button"
            >
                Switch workspace
            </button>

        </div>

    </header>


    <!-- ==========================================
         MAIN APPLICATION
    =========================================== -->

    <main class="main-content">

        <div id="pageContent"></div>

    </main>

    <dialog id="appDialog" class="app-dialog" aria-labelledby="appDialogTitle">
        <form id="appDialogForm" class="app-dialog-card" method="dialog">
            <h2 id="appDialogTitle"></h2>
            <p id="appDialogMessage"></p>
            <label id="appDialogInputLabel" class="app-dialog-input-label" hidden>
                <span id="appDialogInputLabelText"></span>
                <input id="appDialogInput" type="text" autocomplete="off">
            </label>
            <div class="app-dialog-actions">
                <button id="appDialogCancel" class="secondary-button" type="button">Cancel</button>
                <button id="appDialogConfirm" class="primary-button" type="submit">Continue</button>
            </div>
        </form>
    </dialog>

    <div id="appToast" class="app-toast" role="status" aria-live="polite"></div>


    <!-- ==========================================
         LIBRARIES
    =========================================== -->

    <script src="js/chart.umd.min.js"></script>


    <!-- ==========================================
         APPLICATION
    =========================================== -->

    <script src="js/mobile-store.js"></script>
    <script src="js/app.js"></script>
    <script src="js/pwa.js"></script>

</body>

</html>
